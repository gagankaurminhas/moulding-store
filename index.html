<style>
:root{--bg:#f6f3ed;--panel:#fffdf9;--panel2:#fbf9f4;--line:#e4ddd1;--line2:#d8cdb9;--ink:#201e1a;--muted:#777269;--gold:#b68b42;--gold2:#8d692c;--gold-soft:#f7efdf;--green:#31865e;--danger:#b45046;--shadow:0 12px 32px rgba(49,40,24,.07);--radius:16px}

.content{display:grid;grid-template-columns:minmax(330px,380px) 1fr;min-height:calc(100vh - 64px)}.sidebar{padding:16px;border-right:1px solid var(--line);background:linear-gradient(180deg,#f8f6f1,#f1eee7);overflow:auto}.heading{display:flex;align-items:end;justify-content:space-between;margin:1px 1px 13px}.eyebrow{font-size:8px;letter-spacing:.2em;color:var(--gold2);font-weight:900}.heading h1{font-size:24px;line-height:1;margin:4px 0 0;letter-spacing:-.04em}.fleet-pill{font-size:8px;letter-spacing:.1em;padding:7px 9px;border-radius:999px;border:1px solid #ddcfb3;background:#fffaf0;color:var(--gold2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:9px}.stat{background:rgba(255,253,249,.96);border:1px solid var(--line);border-radius:13px;padding:10px 11px;box-shadow:var(--shadow)}.stat span{display:block;font-size:8px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}.stat strong{display:block;font-size:19px;line-height:1.1;margin-top:3px}
.card{background:rgba(255,253,249,.98);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);margin-bottom:9px}.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.card-head strong{font-size:12px}.subtle{font-size:8px;color:var(--muted)}.plus{width:24px;height:24px;border-radius:8px;background:var(--gold-soft);color:var(--gold2);border:1px solid #eadbbb;display:grid;place-items:center;font-weight:900}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.full{grid-column:1/-1}.field label{display:block;font-size:8px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 4px 2px}.field input,.field select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);outline:none;font-size:11px}.field input::placeholder{color:#aaa39a}.field input:focus,.field select:focus{border-color:#c4a15a;box-shadow:0 0 0 3px rgba(182,139,66,.12)}.save{width:100%;margin-top:4px;display:flex;align-items:center;justify-content:space-between}
.address-wrap{position:relative}.address-suggestions{display:none;position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:3000;padding:5px;border:1px solid #d9d1c3;border-radius:13px;background:#fffefa;box-shadow:0 20px 50px rgba(41,33,20,.18);max-height:280px;overflow:auto}.address-suggestions.show{display:block}.address-suggestion{width:100%;display:flex;align-items:center;gap:9px;text-align:left;background:transparent;border:0;border-radius:9px;padding:10px}.address-suggestion:hover,.address-suggestion.active{background:#f6f0e5}.pin{width:27px;height:27px;border-radius:8px;background:#fbf1dc;border:1px solid #ead9b4;color:#8b672d;display:grid;place-items:center;font-size:13px;flex:0 0 27px}.address-copy{min-width:0;flex:1}.address-copy strong{display:block;font-size:11px;line-height:1.25;color:#171612;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.address-copy small{display:block;font-size:8px;line-height:1.3;color:#767067;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.chev{font-size:18px;color:#aa9a7d}.no-result{padding:11px 10px;font-size:9px;color:#6f6a62;line-height:1.4}
.routes{padding-bottom:8px}.truck{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:7px;background:#fff}.truck-head{display:flex;align-items:center;justify-content:space-between;padding:9px 10px}.truck-id{display:flex;align-items:center;gap:8px}.dot{width:8px;height:8px;border-radius:50%;box-shadow:0 0 11px currentColor}.truck-id b{font-size:10px}.truck-id span{display:block;font-size:8px;color:var(--muted);margin-top:1px}.share{border:0;background:transparent;color:#716b62;font-size:8px;font-weight:800}.truck-body{border-top:1px solid #eee8de;padding:6px}.truck-body.over{background:#fbf3e2}.empty{padding:9px;border:1px dashed #d9d0c0;border-radius:9px;text-align:center;font-size:8px;color:#938b80;background:#fcfaf6}.stop{display:flex;align-items:center;gap:7px;padding:7px;border:1px solid #ece5da;background:#fcfbf7;border-radius:9px;margin:4px 0;cursor:grab}.stop:hover{border-color:#d8cbb3;background:#fffdf9}.num{width:22px;height:22px;border-radius:7px;background:#f0ebe1;display:grid;place-items:center;color:#625840;font-size:9px;font-weight:900;flex:0 0 22px}.stop-copy{flex:1;min-width:0}.stop-copy b,.stop-copy span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stop-copy b{font-size:9px}.stop-copy span{font-size:8px;color:#7e776d;margin-top:2px}.tag{font-size:7px;border:1px solid #dfd3bd;border-radius:999px;padding:3px 5px;color:#77684e;background:#fffaf0}
.map-pane{position:relative;min-width:0;background:#e5ebe6}.map{height:100%;min-height:500px}.map-overlay{position:absolute;left:14px;right:14px;top:14px;z-index:700;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}.map-card{background:rgba(255,253,249,.96);border:1px solid var(--line);border-radius:12px;padding:9px 11px;box-shadow:0 8px 24px rgba(43,34,22,.07);backdrop-filter:blur(12px)}.map-card b{font-size:11px}.map-card .eyebrow{margin-bottom:4px}.map-chips{display:flex;gap:5px}.chip{background:rgba(255,253,249,.96);border:1px solid var(--line);border-radius:999px;padding:7px 9px;font-size:8px;color:#6f685f;box-shadow:0 8px 20px rgba(43,34,22,.06)}.chip strong{color:#26231e;margin-left:2px}.map-fallback{height:100%;display:grid;place-items:center;padding:30px;color:var(--muted);text-align:center;background:linear-gradient(135deg,#edf2ee,#e2e8e2)}.map-fallback .box{background:#fffdf9;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);max-width:360px}.map-fallback b{display:block;color:var(--ink);margin-bottom:6px}.map-fallback span{font-size:10px;line-height:1.4}
.leaflet-control-zoom a{color:#26231e!important;background:#fffdf9!important;border-color:#e4ddd1!important}.leaflet-control-attribution{background:rgba(255,253,249,.9)!important;color:#6f685f!important}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#fffdf9!important;color:#1c1a16!important}.leaflet-popup-content{font-size:12px}.map-marker{width:29px;height:29px;border-radius:9px;border:2px solid #fff;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:900;box-shadow:0 5px 16px rgba(0,0,0,.24)}
.boot{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#fbfaf6,#f0ece4)}.boot-box{width:min(460px,100%);text-align:center;background:#fffdf9;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:var(--shadow)}.boot-mark{width:50px;height:50px;border-radius:14px;background:#f7eedb;border:1px solid #dfcc9f;display:grid;place-items:center;margin:0 auto 14px;color:#86631f;font-weight:900}.boot-box h1{font-size:14px;letter-spacing:.18em;margin:0;color:#1c1a16}.boot-box p{font-size:11px;color:var(--muted);margin:8px 0 0}.fatal{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f6f3ed}.fatal-box{width:min(620px,100%);background:#fffdf9;border:1px solid #decfc1;border-radius:18px;padding:24px;box-shadow:var(--shadow)}.fatal-box h1{margin:0 0 8px}.fatal-box p{margin:0 0 12px;color:var(--muted)}.fatal-box pre{white-space:pre-wrap;word-break:break-word;background:#f8f4ec;border-radius:10px;padding:12px;font-size:10px;overflow:auto}
@media(max-width:920px){.content{display:flex;flex-direction:column}.map-pane{order:1;height:46vh;min-height:360px}.sidebar{order:2;border-right:0;padding:11px}.topbar{height:56px;padding:0 12px}.live{display:none}.map-overlay{top:9px;left:9px;right:9px}.map-chips{display:none}.heading h1{font-size:22px}}

<body>
<div id="root"><div class="boot"><div class="boot-box"><div class="boot-mark">MS</div><h1>MOULDING STORE</h1><p>Opening route control…</p></div></div></div>
<script>
(function(){
  'use strict';
  const VERSION='v11';
  const CONFIG={tiles:'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',attribution:'© OpenStreetMap contributors',photon:'https://photon.komoot.io/api',bbox:'-120.0,48.9,-110.0,60.0'};
  const fleet=[
    {id:'5T-01',type:'5 Ton',capacity:5,color:'#4ea1ff'},{id:'5T-02',type:'5 Ton',capacity:5,color:'#6d7cff'},{id:'5T-03',type:'5 Ton',capacity:5,color:'#9a72ff'},{id:'5T-04',type:'5 Ton',capacity:5,color:'#48c7d9'},
    {id:'3T-01',type:'3 Ton',capacity:3,color:'#55c978'},{id:'3T-02',type:'3 Ton',capacity:3,color:'#9bd24f'},
    {id:'VAN-01',type:'Sprinter',capacity:null,color:'#e7b84d'},{id:'VAN-02',type:'Sprinter',capacity:null,color:'#f08a4b'}
  ];
  const root=document.getElementById('root');
  let jobs=[]; try{jobs=JSON.parse(localStorage.getItem('ms_jobs')||'[]')}catch(e){jobs=[]}
  let map=null, layers=[]; let acTimer=null, acController=null, acResults=[], acActive=-1;
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const save=()=>localStorage.setItem('ms_jobs',JSON.stringify(jobs));
  const isAB=p=>{const country=String(p.countrycode||p.country_code||p.country||'').toLowerCase();const state=String(p.state||p.province||'').toLowerCase();return (country==='ca'||country==='canada')&&(state==='alberta'||state==='ab')};
  const hasHouse=p=>/^\d/.test(String(p.housenumber||p.house_number||'').trim());
  const titleOf=f=>{const p=f.properties||{};const h=p.housenumber||p.house_number||'';const s=p.street||p.road||p.name||'';return [h,s].filter(Boolean).join(' ')||p.label||'Address result'};
  const detailOf=f=>{const p=f.properties||{};return [p.city||p.locality||p.district,p.state||p.province,p.postcode].filter(Boolean).join(', ')||'Alberta, Canada'};
  function feature(f,streetOnly=false){const p=f.properties||{},c=f.geometry?.coordinates||[];return {display_name:[p.housenumber,p.street||p.name,p.city||p.locality,p.state,p.postcode,p.country].filter(Boolean).join(', '),lat:Number(c[1]),lng:Number(c[0]),place_id:p.osm_id||p.osm_type||titleOf(f),raw:f,streetOnly};}
  async function photon(q,extra={}){
    if(acController) acController.abort(); acController=new AbortController();
    const params=new URLSearchParams({q,limit:'12',lang:'en',countrycode:'CA',bbox:CONFIG.bbox,...extra});
    const r=await fetch(CONFIG.photon+'?'+params,{signal:acController.signal,headers:{Accept:'application/json'}});
    if(!r.ok)throw new Error('Address service returned '+r.status);
    const d=await r.json();return Array.isArray(d.features)?d.features:[];
  }
  async function addressSearch(q){
    if(!/\d/.test(q)) return {items:[],message:'Start with the house number, then the street name.'};
    const n=q.replace(/\s+/g,' ').trim(); let fs=[];
    try{fs=await photon(n,{layer:'house'})}catch(e){if(e.name==='AbortError')throw e;}
    let out=fs.filter(f=>isAB(f.properties||{})&&hasHouse(f.properties||{})).map(f=>feature(f));
    if(!out.length){
      try{fs=await photon(n)}catch(e){if(e.name==='AbortError')throw e;fs=[]}
      out=fs.filter(f=>isAB(f.properties||{})&&hasHouse(f.properties||{})).map(f=>feature(f));
    }
    return out.length?{items:out.slice(0,8)}:{items:[],message:'No exact Alberta address found. Add the city or postal code.'};
  }
  function renderSuggestions(items,message){
    const box=document.getElementById('address-suggestions'); if(!box)return; box.innerHTML=''; acResults=items||[]; acActive=-1;
    if(!items?.length){if(message){box.innerHTML='<div class="no-result">'+esc(message)+'</div>';box.classList.add('show')}else box.classList.remove('show');return}
    items.forEach((f,i)=>{const b=document.createElement('button');b.type='button';b.className='address-suggestion';b.innerHTML='<span class="pin">⌖</span><span class="address-copy"><strong>'+esc(titleOf(f.raw))+'</strong><small>'+esc(detailOf(f.raw))+'</small></span><span class="chev">›</span>';b.addEventListener('mousedown',e=>{e.preventDefault();pickAddress(i)});box.appendChild(b)});box.classList.add('show');
  }
  function clearSuggestions(){const box=document.getElementById('address-suggestions');if(box){box.innerHTML='';box.classList.remove('show')}acResults=[];acActive=-1}
  function pickAddress(i){const f=acResults[i],input=document.getElementById('address');if(!f)return;input.value=f.display_name||titleOf(f.raw);input.dataset.lat=Number.isFinite(f.lat)?String(f.lat):'';input.dataset.lng=Number.isFinite(f.lng)?String(f.lng):'';input.dataset.selected='1';clearSuggestions()}
  function setupAutocomplete(){const input=document.getElementById('address');const box=document.createElement('div');box.id='address-suggestions';box.className='address-suggestions';input.parentElement.appendChild(box);input.setAttribute('autocomplete','off');input.addEventListener('input',()=>{input.dataset.selected='';input.dataset.lat='';input.dataset.lng='';clearTimeout(acTimer);const q=input.value.trim();if(q.length<3){clearSuggestions();return}acTimer=setTimeout(async()=>{try{const r=await addressSearch(q);renderSuggestions(r.items,r.message)}catch(e){if(e.name!=='AbortError')renderSuggestions([],'Address search is temporarily unavailable. Please try again.')}},320)});input.addEventListener('keydown',e=>{if(!box.classList.contains('show')||!acResults.length)return;if(e.key==='ArrowDown'){e.preventDefault();acActive=Math.min(acActive+1,acResults.length-1)}else if(e.key==='ArrowUp'){e.preventDefault();acActive=Math.max(acActive-1,0)}else if(e.key==='Enter'&&acActive>=0){e.preventDefault();pickAddress(acActive)}else if(e.key==='Escape'){clearSuggestions();return}else return;box.querySelectorAll('.address-suggestion').forEach((x,i)=>x.classList.toggle('active',i===acActive))});document.addEventListener('click',e=>{if(!input.parentElement.contains(e.target))clearSuggestions()})}
  function ui(){
    root.innerHTML=`<div class="app-shell"><header class="topbar"><div class="brand"><div class="brand-mark">MS</div><div class="brand-text"><strong>MOULDING STORE</strong><span>ROUTE CONTROL</span></div></div><div class="top-actions"><div class="live"><i></i>LIVE</div><button class="btn icon" id="export" title="Export CSV">↓</button><button class="btn gold" id="opt">Optimize</button></div></header><div class="content"><aside class="sidebar"><div class="heading"><div><div class="eyebrow">TODAY</div><h1>Delivery board</h1></div><div class="fleet-pill">8 FLEET</div></div><div class="stats"><div class="stat"><span>Stops</span><strong id="jc">0</strong></div><div class="stat"><span>Assigned</span><strong id="ac">0</strong></div><div class="stat"><span>Vehicles</span><strong>8</strong></div></div><section class="card"><div class="card-head"><div><div class="eyebrow">QUICK ADD</div><strong>New delivery</strong></div><div class="plus">+</div></div><form id="form"><div class="grid"><div class="field"><label>Customer</label><input id="customer" required placeholder="Customer name"></div><div class="field"><label>Vehicle</label><select id="vehicle"><option>5 Ton</option><option>3 Ton</option><option>Sprinter</option></select></div><div class="field full"><label>Delivery address</label><div class="address-wrap"><input id="address" required placeholder="House number + street"></div></div><div class="field"><label>Service</label><input id="service" type="number" min="0" value="15"></div><div class="field"><label>Load / tons</label><input id="weight" type="number" min="0" step=".1" placeholder="Optional"></div></div><button class="btn gold save" type="submit"><span>Add delivery</span><span>→</span></button></form></section><section class="card routes"><div class="card-head"><div><div class="eyebrow">OPERATIONS</div><strong>Routes</strong></div><span class="subtle">Drag to rebalance</span></div><div id="routes"></div></section></aside><section class="map-pane"><div class="map-overlay"><div class="map-card"><div class="eyebrow">LIVE MAP</div><b>Fleet overview</b></div><div class="map-chips"><div class="chip">5T <strong>4</strong></div><div class="chip">3T <strong>2</strong></div><div class="chip">VAN <strong>2</strong></div></div></div><div id="map" class="map"><div class="map-fallback" id="map-fallback"><div class="box"><b>Loading fleet map…</b><span>The delivery board is ready even while the map loads.</span></div></div></div></section></div></div>`;
    setupAutocomplete(); document.getElementById('form').addEventListener('submit',addDelivery);document.getElementById('opt').addEventListener('click',optimize);document.getElementById('export').addEventListener('click',exportCsv);renderRoutes();loadLeaflet();
  }
  function addDelivery(e){e.preventDefault();const form=e.currentTarget,input=document.getElementById('address'),btn=form.querySelector('button[type=submit]');if(!input.dataset.selected){alert('Please select an Alberta address from the suggestions.');input.focus();return}const lat=Number(input.dataset.lat),lng=Number(input.dataset.lng);if(!Number.isFinite(lat)||!Number.isFinite(lng)){alert('The selected address did not return map coordinates. Please choose another suggestion.');return}btn.disabled=true;btn.querySelector('span').textContent='Saving…';jobs.push({id:(crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())),customer:document.getElementById('customer').value.trim(),address:input.value.trim(),vehicle:document.getElementById('vehicle').value,service:Number(document.getElementById('service').value||15),weight:Number(document.getElementById('weight').value||0),truckId:null,lat,lng});save();form.reset();document.getElementById('service').value=15;btn.disabled=false;btn.querySelector('span').textContent='Add delivery';renderRoutes();drawMap();}
  function optimize(){const types=['5 Ton','3 Ton','Sprinter'];types.forEach(type=>{const trucks=fleet.filter(t=>t.type===type),list=jobs.filter(j=>j.vehicle===type);list.forEach((j,i)=>j.truckId=trucks[i%trucks.length]?.id||null)});save();renderRoutes();drawMap()}
  function moveJob(id,truckId){const j=jobs.find(x=>x.id===id),t=fleet.find(x=>x.id===truckId);if(j&&t&&j.vehicle===t.type){j.truckId=t.id;save();renderRoutes();drawMap()}}
  function renderRoutes(){const root=document.getElementById('routes');if(!root)return;root.innerHTML='';document.getElementById('jc').textContent=jobs.length;document.getElementById('ac').textContent=jobs.filter(j=>j.truckId).length;fleet.forEach(t=>{const stops=jobs.filter(j=>j.truckId===t.id);const card=document.createElement('div');card.className='truck';card.innerHTML='<div class="truck-head"><div class="truck-id"><span class="dot" style="background:'+t.color+';color:'+t.color+'"></span><div><b>'+t.id+'</b><span>'+t.type+' · '+(t.capacity?t.capacity+'T':'Van')+' · '+stops.length+' stops</span></div></div><button class="share" type="button">Share ↗</button></div><div class="truck-body" data-truck="'+t.id+'"></div>';const body=card.querySelector('.truck-body');body.addEventListener('dragover',e=>{e.preventDefault();body.classList.add('over')});body.addEventListener('dragleave',()=>body.classList.remove('over'));body.addEventListener('drop',e=>{e.preventDefault();body.classList.remove('over');moveJob(e.dataTransfer.getData('job'),t.id)});card.querySelector('.share').addEventListener('click',()=>shareRoute(t.id));if(!stops.length)body.innerHTML='<div class="empty">Drop a compatible job here</div>';stops.forEach((j,i)=>{const s=document.createElement('div');s.className='stop';s.draggable=true;s.innerHTML='<div class="num">'+(i+1)+'</div><div class="stop-copy"><b>'+esc(j.customer)+'</b><span>'+esc(j.address)+'</span></div><span class="tag">'+esc(j.vehicle)+'</span>';s.addEventListener('dragstart',e=>e.dataTransfer.setData('job',j.id));body.appendChild(s)});root.appendChild(card)})}
  function exportCsv(){const rows=[['ID','Customer','Address','Vehicle','Truck','Stop','ServiceMinutes','WeightTons']];fleet.forEach(t=>jobs.filter(j=>j.truckId===t.id).forEach((j,i)=>rows.push([j.id,j.customer,j.address,j.vehicle,t.id,i+1,j.service,j.weight])));jobs.filter(j=>!j.truckId).forEach(j=>rows.push([j.id,j.customer,j.address,j.vehicle,'','',j.service,j.weight]));const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='moulding-routes.csv';a.click();URL.revokeObjectURL(a.href)}
  async function shareRoute(id){const t=fleet.find(x=>x.id===id),stops=jobs.filter(j=>j.truckId===id&&Number.isFinite(j.lat)&&Number.isFinite(j.lng));if(!stops.length){alert('This route has no mapped stops yet.');return}const origin=encodeURIComponent(stops[0].lat+','+stops[0].lng),dest=encodeURIComponent(stops[stops.length-1].lat+','+stops[stops.length-1].lng);let url='https://www.google.com/maps/dir/?api=1&origin='+origin+'&destination='+dest+'&travelmode=driving';if(stops.length>2)url+='&waypoints='+encodeURIComponent(stops.slice(1,-1).map(x=>x.lat+','+x.lng).join('|'));if(navigator.share){try{await navigator.share({title:t.id+' Route',url})}catch(e){}}else if(navigator.clipboard){await navigator.clipboard.writeText(url);alert('Google Maps link copied.')}}
  function drawMap(){if(!map)return;layers.forEach(x=>map.removeLayer(x));layers=[];const all=[];fleet.forEach(t=>{const stops=jobs.filter(j=>j.truckId===t.id),pts=[];stops.forEach((j,i)=>{if(!Number.isFinite(j.lat)||!Number.isFinite(j.lng))return;pts.push([j.lat,j.lng]);all.push([j.lat,j.lng]);const icon=L.divIcon({className:'',html:'<div class="map-marker" style="background:'+t.color+'">'+(i+1)+'</div>',iconSize:[29,29],iconAnchor:[14,14]});layers.push(L.marker([j.lat,j.lng],{icon}).bindPopup('<b>'+esc(j.customer)+'</b><br>'+esc(j.address)+'<br>'+t.id).addTo(map))});if(pts.length>1){const line=L.polyline(pts,{color:t.color,weight:5,opacity:.82});line.on('mouseover',()=>line.setStyle({weight:10}));line.on('mouseout',()=>line.setStyle({weight:5}));layers.push(line.addTo(map))}});if(all.length)map.fitBounds(all,{padding:[30,30],maxZoom:13})}
  function loadLeaflet(){
    if(window.L){startMap();return}
    const css=document.createElement('link');css.rel='stylesheet';css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(css);
    const s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.onload=startMap;s.onerror=()=>{const f=document.getElementById('map-fallback');if(f)f.innerHTML='<div class="box"><b>Map library unavailable</b><span>The route board is working. Check your internet connection or allow unpkg.com, then refresh.</span></div>'};document.head.appendChild(s);
  }
  function startMap(){try{map=L.map('map',{zoomControl:true,attributionControl:true}).setView([51.0447,-114.0719],10);L.tileLayer(CONFIG.tiles,{attribution:CONFIG.attribution,maxZoom:19}).addTo(map);const f=document.getElementById('map-fallback');if(f)f.remove();drawMap()}catch(e){const f=document.getElementById('map-fallback');if(f)f.innerHTML='<div class="box"><b>Map could not start</b><span>'+esc(e.message||e)+'</span></div>'}}
  function startup(){
    ui();
    // Remove stale service workers from prior versions. No service worker is registered by v11.
    try{if(navigator.serviceWorker)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{})}catch(e){}
  }
  window.addEventListener('error',e=>{if(!document.querySelector('.app-shell'))root.innerHTML='<div class="fatal"><div class="fatal-box"><h1>Moulding Store</h1><p>The page hit a startup error.</p><pre>'+esc(e.error?.stack||e.message||'Unknown error')+'</pre></div></div>'});
  try{startup()}catch(e){root.innerHTML='<div class="fatal"><div class="fatal-box"><h1>Moulding Store</h1><p>The page could not start.</p><pre>'+esc(e.stack||e.message||e)+'</pre></div></div>'}
})();
</script>
</body>
