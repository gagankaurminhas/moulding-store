t;font-size:10px;vertical-align:top}th{position:sticky;top:0;background:#faf7f1;text-transform:uppercase;letter-spacing:.08em;font-size:8px;color:var(--muted);z-index:1}.empty{padding:14px;text-align:center;color:#9a9388;font-size:10px;border:1px dashed #ddd3c4;border-radius:10px}.modal{position:fixed;inset:0;background:rgba(23,25,22,.34);backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center;z-index:4000;padding:14px}.modal.show{display:flex}.modal-card{width:min(760px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid #dcd3c4;border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.18)}.modal-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.modal-head b{font-size:13px}.modal-body{padding:16px}.modal-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:7px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.form-grid .full{grid-column:1/-1}.field label{display:block;font-size:9px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.08em}.field input,.field select,.field textarea{width:100%;height:36px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:0 10px;outline:none;color:var(--ink);font-size:11px}.field textarea{height:80px;padding:9px;resize:vertical}.address-wrap{position:relative}.suggestions{position:absolute;left:0;right:0;top:40px;z-index:5000;background:#fff;border:1px solid #dacdb9;border-radius:11px;box-shadow:0 18px 40px rgba(30,25,18,.14);overflow:hidden;display:none}.suggestions.show{display:block}.suggestion{padding:9px 11px;border-bottom:1px solid #efe8de;cursor:pointer}.suggestion:last-child{border-bottom:0}.suggestion:hover{background:#fbf3e5}.suggestion b{display:block;font-size:11px;color:#171915;font-weight:750}.suggestion span{display:block;font-size:9px;color:#73766f;margin-top:2px}.driver-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.sync-note{font-size:10px;line-height:1.5;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px}.driver-screen{position:fixed;inset:0;z-index:5000;background:#f3efe7;display:none;flex-direction:column}.driver-screen.show{display:flex}.driver-top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#fffdfa;border-bottom:1px solid var(--line)}.driver-top b{font-size:12px}.driver-main{padding:16px;overflow:auto}.next-card{background:var(--dark);color:#fff;border-radius:20px;padding:16px;box-shadow:var(--shadow)}.next-card .label{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:#c4c8c3}.next-card h2{margin:8px 0 4px;font-size:22px}.next-card p{margin:0;color:#d8dbd7;font-size:11px;line-height:1.5}.driver-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.driver-actions .btn{height:44px}.pod-preview{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.pod-preview img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}.signature{width:100%;height:180px;border:1px dashed #cfc4b4;border-radius:10px;background:#fff;touch-action:none}.fatal{min-height:100vh;display:grid;place-items:center;background:#f4f0e8;padding:20px}.fatal-box{max-width:680px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}.fatal-box h1{margin:0 0 7px}.fatal-box pre{white-space:pre-wrap;font-size:11px;color:#8c433d;background:#fff6f4;padding:10px;border-radius:10px}.toast{position:fixed;right:16px;bottom:16px;background:#202522;color:#fff;border-radius:11px;padding:10px 13px;font-size:10px;box-shadow:0 15px 30px rgba(0,0,0,.16);z-index:6000;opacity:0;transform:translateY(8px);transition:.18s}.toast.show{opacity:1;transform:none}.hidden{display:none!important}
@media(max-width:1200px){.board{grid-template-columns:250px minmax(360px,1fr)}.routes{grid-column:1/-1;min-height:0}.routes-scroll{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.route{margin:0}.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:780px){.topbar{height:auto;min-height:66px;align-items:flex-start;padding:10px 12px;flex-wrap:wrap}.brand{min-width:150px}.toolbar{width:100%;overflow:auto;padding-bottom:2px}.search{flex:1;min-width:145px}.date-input{width:126px}.viewbar{padding:0 10px;overflow:auto}.page{padding:10px}.kpis{grid-template-columns:repeat(3,1fr);gap:7px}.kpi{padding:9px}.kpi .value{font-size:17px}.board{grid-template-columns:1fr}.queue,.map-panel{min-height:0}.map{min-height:360px}.routes-scroll{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.driver-grid{grid-template-columns:1fr 1fr}.modal{align-items:flex-end;padding:0}.modal-card{border-radius:20px 20px 0 0;max-height:94vh}.route-metrics{grid-template-columns:repeat(2,1fr)}}

<body>
<div id="root"></div>
<div id="toast" class="toast"></div>
<div id="modal" class="modal"></div>
<div id="driverScreen" class="driver-screen"></div>
<script>
(function(){
'use strict';
const VERSION='13.0.0';
const CONFIG={photon:'https://photon.komoot.io/api/',osrm:'https://router.project-osrm.org/route/v1/driving/',tiles:'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',attribution:'© OpenStreetMap contributors'};
const AB_BBOX=[-120.0,48.9,-109.5,60.1];
const VEHICLES={"5T":{label:'5 Ton',capacity:5,color:'#b77d3f'},"3T":{label:'3 Ton',capacity:3,color:'#547993'},"SPRINTER":{label:'Sprinter',capacity:1.5,color:'#68836c'}};
const seededTrucks=[['5T-01','5T'],['5T-02','5T'],['5T-03','5T'],['5T-04','5T'],['3T-01','3T'],['3T-02','3T'],['VAN-01','SPRINTER'],['VAN-02','SPRINTER']];
let db=null, state={jobs:[],drivers:[],trucks:[],events:[],settings:{warehouse:{name:'Moulding Store Warehouse',address:'',lat:null,lng:null},excelWebhook:'',trackingWebhook:'',selectedDate:new Date().toISOString().slice(0,10)}};
let map=null,mapLayers=[],routeMetrics={},gpsWatch=null,currentDriverTruck=null;
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function uid(p='id'){return p+'_'+Math.random().toString(36).slice(2,9)+'_'+Date.now().toString(36)}
function today(){return new Date().toISOString().slice(0,10)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600)}
async function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('moulding_store_worldclass',1);r.onupgradeneeded=()=>{const d=r.result;['jobs','drivers','trucks','events','settings','media','telemetry'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store)}
async function all(store){return new Promise((resolve,reject)=>{const r=tx(store).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error)})}
async function put(store,obj){return new Promise((resolve,reject)=>{const r=tx(store,'readwrite').put(obj);r.onsuccess=()=>resolve(obj);r.onerror=()=>reject(r.error)})}
async function del(store,id){return new Promise((resolve,reject)=>{const r=tx(store,'readwrite').delete(id);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)})}
async function saveState(){for(const j of state.jobs)await put('jobs',j);for(const d of state.drivers)await put('drivers',d);for(const t of state.trucks)await put('trucks',t);for(const e of state.events)await put('events',e);await put('settings',{id:'settings',...state.settings})}
async function loadState(){state.jobs=await all('jobs');state.drivers=await all('drivers');state.trucks=await all('trucks');state.events=await all('events');const st=(await all('settings'))[0];if(st)state.settings={...state.settings,...st};if(!state.trucks.length){state.trucks=seededTrucks.map((x,i)=>({id:x[0],type:x[1],name:x[0],capacity:VEHICLES[x[1]].capacity,driverId:'',color:VEHICLES[x[1]].color,active:true}));for(const t of state.trucks)await put('trucks',t)}if(!state.drivers.length){state.drivers=Array.from({length:8},(_,i)=>({id:'drv_'+(i+1),name:'Driver '+String(i+1).padStart(2,'0'),phone:'',active:true,defaultTruckId:state.trucks[i]?.id||''}));for(const d of state.drivers)await put('drivers',d)}}
function jobsToday(){return state.jobs.filter(j=>j.date===state.settings.selectedDate)}
function jobTruck(j){return state.trucks.find(t=>t.id===j.truckId)||null}
function truckDriver(t){const d=state.drivers.find(x=>x.id===t.driverId);return d||null}
function driverName(t){return truckDriver(t)?.name||'Unassigned'}
function canAssign(j,t){return j.vehicleType===t.type}
function truckJobs(t){return jobsToday().filter(j=>j.truckId===t.id).sort((a,b)=>(a.stopIndex??999)-(b.stopIndex??999))}
function unassignedJobs(){return jobsToday().filter(j=>!j.truckId)}
function assignedWeight(t){return truckJobs(t).reduce((s,j)=>s+Number(j.weight||0),0)}
function routeEstimate(t){const js=truckJobs(t);let service=js.reduce((s,j)=>s+Number(j.serviceMin||20),0),dist=0;let prev=state.settings.warehouse;for(const j of js){if(Number.isFinite(prev.lat)&&Number.isFinite(prev.lng)&&Number.isFinite(j.lat)&&Number.isFinite(j.lng))dist+=haversine(prev.lat,prev.lng,j.lat,j.lng);prev=j}if(js.length&&Number.isFinite(prev.lat)&&Number.isFinite(prev.lng)&&Number.isFinite(state.settings.warehouse.lat)&&Number.isFinite(state.settings.warehouse.lng))dist+=haversine(prev.lat,prev.lng,state.settings.warehouse.lat,state.settings.warehouse.lng);const drive=dist/45*60;return {distKm:dist,driveMin:drive,totalMin:drive+service,service,stops:js.length}}
function haversine(a,b,c,d){const R=6371,rad=x=>x*Math.PI/180,da=rad(c-a),db=rad(d-b),q=Math.sin(da/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(db/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
async function logEvent(type,jobId,data={}){const e={id:uid('evt'),time:new Date().toISOString(),type,jobId:jobId||'',data};state.events.push(e);await put('events',e)}
function statusClass(s){return String(s||'').toLowerCase().replace(/\s+/g,'')}
function statusLabel(s){return s==='En Route'?'En route':s}
async function setJobStatus(id,status){const j=state.jobs.find(x=>x.id===id);if(!j)return;j.status=status;j.updatedAt=new Date().toISOString();await put('jobs',j);await logEvent('status',id,{status});render();syncExcelSilently()}
async function assignDriver(truckId,driverId){const t=state.trucks.find(x=>x.id===truckId);if(!t)return;if(driverId){const other=state.trucks.find(x=>x.id!==truckId&&x.driverId===driverId);if(other){toast('That driver is already assigned to '+other.id+'.');render();return}}t.driverId=driverId;await put('trucks',t);await logEvent('driver_assigned','',{truckId,driverId});render();syncExcelSilently()}
async function moveJob(jobId,truckId,beforeId=''){const j=state.jobs.find(x=>x.id===jobId);if(!j)return;if(truckId){const t=state.trucks.find(x=>x.id===truckId);if(!canAssign(j,t)){toast('Vehicle type is not compatible with this truck.');return}const w=assignedWeight(t)-Number(j.weight||0)+Number(j.weight||0);if(w>Number(t.capacity||0)){toast('Truck capacity would be exceeded.');return}j.truckId=truckId;j.status=j.status==='Scheduled'?'Scheduled':j.status}else j.truckId='';const same=jobsToday().filter(x=>x.truckId===truckId&&x.id!==j.id).sort((a,b)=>(a.stopIndex??999)-(b.stopIndex??999));if(truckId&&beforeId){const idx=same.findIndex(x=>x.id===beforeId);if(idx>=0)same.splice(idx,0,j);else same.push(j)}else if(truckId)same.push(j);if(truckId)same.forEach((x,i)=>x.stopIndex=i+1);j.stopIndex=truckId?(same.findIndex(x=>x.id===j.id)+1):null;await put('jobs',j);for(const x of same)if(x.id!==j.id)await put('jobs',x);await logEvent(truckId?'assigned':'unassigned',j.id,{truckId});render();syncExcelSilently()}
async function removeJob(id){const j=state.jobs.find(x=>x.id===id);if(!j)return;if(!confirm('Delete this delivery?'))return;state.jobs=state.jobs.filter(x=>x.id!==id);await del('jobs',id);await logEvent('deleted',id,{});render();syncExcelSilently()}
function normalizeRank(t){const js=truckJobs(t);js.forEach((j,i)=>{j.stopIndex=i+1;put('jobs',j)});return js}
async function autoOptimize(){const date=state.settings.selectedDate;const jobs=state.jobs.filter(j=>j.date===date && !['Delivered','Canceled'].includes(j.status));const ts=state.trucks.filter(t=>t.active);ts.forEach(t=>{jobs.filter(j=>j.truckId===t.id).forEach(j=>{j.truckId='';j.stopIndex=null})});for(const j of jobs)if(j.truckId){j.truckId='';j.stopIndex=null}const buckets=new Map(ts.map(t=>[t.id,[]]));const pool=[...jobs].sort((a,b)=>(Number(b.priority||0)-Number(a.priority||0)) || ((Number(b.weight||0)-Number(a.weight||0))));for(const j of pool){const choices=ts.filter(t=>canAssign(j,t)&&assignedWeight(t)+Number(j.weight||0)<=Number(t.capacity||0)+0.0001);if(!choices.length){continue}let best=null,bestScore=Infinity;for(const t of choices){const js=buckets.get(t.id);const last=js.at(-1);const from=last&&Number.isFinite(last.lat)&&Number.isFinite(last.lng)?last:state.settings.warehouse;const leg=(Number.isFinite(from.lat)&&Number.isFinite(from.lng)&&Number.isFinite(j.lat)&&Number.isFinite(j.lng))?haversine(from.lat,from.lng,j.lat,j.lng):999;const workload=routeTimeBucket(js);const score=leg*1.4 + workload*0.28 + (assignedWeight(t)/Math.max(1,t.capacity))*12;if(score<bestScore){bestScore=score;best=t}}if(best)buckets.get(best.id).push(j)}for(const t of ts){let js=buckets.get(t.id)||[];let ordered=[];let cur=state.settings.warehouse;while(js.length){let idx=0,best=Infinity;for(let i=0;i<js.length;i++){const d=Number.isFinite(cur.lat)&&Number.isFinite(cur.lng)&&Number.isFinite(js[i].lat)&&Number.isFinite(js[i].lng)?haversine(cur.lat,cur.lng,js[i].lat,js[i].lng):999;if(d<best){best=d;idx=i}}const [pick]=js.splice(idx,1);ordered.push(pick);cur=pick}for(let i=0;i<ordered.length;i++){ordered[i].truckId=t.id;ordered[i].stopIndex=i+1;await put('jobs',ordered[i])}}for(const j of jobs.filter(j=>!j.truckId))await put('jobs',j);await logEvent('optimize','',{date,count:jobs.length});render();refreshRouteMetrics();syncExcelSilently();toast('Routes optimized around vehicle class, capacity and workload.');}
function routeTimeBucket(js){return js.reduce((s,j)=>s+Number(j.serviceMin||20),0)+js.length*8}
function getFilteredJobs(){const q=(document.getElementById('globalSearch')?.value||'').trim().toLowerCase();return jobsToday().filter(j=>!q||[j.customer,j.address,j.status,j.vehicleType].some(v=>String(v||'').toLowerCase().includes(q)))}
function render(){document.getElementById('root').innerHTML=appHTML();bindUI();renderMapShell();loadLeaflet();}
function appHTML(){const js=jobsToday(),assigned=js.filter(j=>j.truckId).length,delivered=js.filter(j=>j.status==='Delivered').length,inprog=js.filter(j=>['En Route','Arrived','Unloading'].includes(j.status)).length,unass=js.filter(j=>!j.truckId).length;return `<div class="app"><header class="topbar"><div class="brand"><div class="brand-mark">MS</div><div class="brand-copy"><b>MOULDING STORE</b><span>FLEET COMMAND</span></div></div><div class="toolbar"><input id="globalSearch" class="search" placeholder="Search customer, address or route…"><input id="dateInput" class="date-input" type="date" value="${state.settings.selectedDate}"><button class="btn primary" id="addBtn">+ Delivery</button><button class="btn" id="optBtn">Optimize</button><button class="btn" id="moreBtn">•••</button></div></header><div class="viewbar"><button class="tab active" data-view="board">Board</button><button class="tab" data-view="jobs">Deliveries</button><button class="tab" data-view="history">History</button><button class="tab" data-view="settings">Settings</button></div><main class="page"><section id="boardView"><div class="kpis"><div class="kpi"><div class="label">Today</div><div class="value">${js.length}</div><div class="sub">delivery jobs</div></div><div class="kpi"><div class="label">Unassigned</div><div class="value">${unass}</div><div class="sub">waiting for dispatch</div></div><div class="kpi"><div class="label">Planned</div><div class="value">${assigned}</div><div class="sub">on vehicle routes</div></div><div class="kpi"><div class="label">In progress</div><div class="value">${inprog}</div><div class="sub">on the road</div></div><div class="kpi"><div class="label">Delivered</div><div class="value">${delivered}</div><div class="sub">completed stops</div></div><div class="kpi"><div class="label">Events</div><div class="value">${state.events.filter(e=>e.time.startsWith(state.settings.selectedDate)).length}</div><div class="sub">today's activity</div></div></div><div class="board"><section class="panel queue"><div class="panel-head"><div class="panel-title">Unassigned queue</div><span class="chip gold">${unass}</span></div><div class="queue-body"><div id="queueDrop" class="queue-drop">Drop a delivery here to unassign</div>${unassignedJobs().map(renderMiniJob).join('')||'<div class="empty">No unassigned deliveries.</div>'}</div></section><section class="panel map-panel"><div id="map" class="map"></div><div id="map-fallback" class="map-empty"><div class="box">Loading operations map…</div></div><div class="map-controls"><button class="btn" id="fitBtn">Fit routes</button><button class="btn" id="centerBtn">Warehouse</button></div><div class="map-legend">${state.trucks.slice(0,8).map(t=>`<div class="legend-row"><i class="legend-dot" style="background:${t.color}"></i>${esc(t.id)} · ${esc(driverName(t))}</div>`).join('')}</div></section><section class="panel routes"><div class="panel-head"><div class="panel-title">Route board</div><span class="chip">Drag stops to rebalance</span></div><div class="routes-scroll">${state.trucks.filter(t=>t.active).map(renderRoute).join('')}</div></section></div></section><section id="jobsView" class="jobs-view"><div class="table-wrap"><table><thead><tr><th>Customer</th><th>Address</th><th>Type</th><th>Truck</th><th>Driver</th><th>Status</th><th>Service</th><th>Weight</th><th>Actions</th></tr></thead><tbody>${getFilteredJobs().map(renderTableJob).join('')||'<tr><td colspan="9"><div class="empty">No deliveries for this date.</div></td></tr>'}</tbody></table></div></section><section id="historyView" class="history-view"><div class="table-wrap"><table><thead><tr><th>Time</th><th>Type</th><th>Customer</th><th>Status</th><th>Truck</th><th>Driver</th><th>Notes</th></tr></thead><tbody>${state.events.filter(e=>e.time.startsWith(state.settings.selectedDate)).sort((a,b)=>b.time.localeCompare(a.time)).map(renderHistory).join('')||'<tr><td colspan="7"><div class="empty">No activity recorded today.</div></td></tr>'}</tbody></table></div></section><section id="settingsView" class="settings-view"><div class="form-grid"><div class="panel"><div class="panel-head"><div class="panel-title">Warehouse</div></div><div class="panel-body"><div class="form-grid"><div class="field"><label>Name</label><input id="whName" value="${esc(state.settings.warehouse.name)}"></div><div class="field"><label>Address</label><input id="whAddress" value="${esc(state.settings.warehouse.address)}"></div><div class="field"><label>Latitude</label><input id="whLat" value="${esc(state.settings.warehouse.lat??'')}"></div><div class="field"><label>Longitude</label><input id="whLng" value="${esc(state.settings.warehouse.lng??'')}"></div><div class="full"><button class="btn gold" id="saveWhBtn">Save warehouse</button></div></div></div></div><div class="panel"><div class="panel-head"><div class="panel-title">Drivers & default trucks</div><button class="mini-btn" id="saveDriversBtn">Save</button></div><div class="panel-body"><div class="driver-grid">${state.drivers.map((d,i)=>`<div class="field"><label>Driver ${i+1}</label><input data-driver="${d.id}" value="${esc(d.name)}"><select data-driver-truck="${d.id}"><option value="">Default truck…</option>${state.trucks.map(t=>`<option value="${t.id}" ${d.defaultTruckId===t.id?'selected':''}>${esc(t.id)}</option>`).join('')}</select></div>`).join('')}</div></div></div><div class="panel" style="grid-column:1/-1"><div class="panel-head"><div class="panel-title">Excel / workflow sync</div><button class="mini-btn" id="syncBtn">Sync now</button></div><div class="panel-body"><div class="form-grid"><div class="field full"><label>Power Automate webhook URL</label><input id="excelWebhook" value="${esc(state.settings.excelWebhook)}" placeholder="https://…"></div><div class="field full"><label>Driver tracking webhook URL (optional)</label><input id="trackingWebhook" value="${esc(state.settings.trackingWebhook)}" placeholder="https://…"></div><div class="full"><div class="sync-note">GitHub Pages cannot safely write directly into your Microsoft workbook. This app stores the operational data locally and can push the full snapshot to Power Automate. The included Office Script upserts Deliveries, Drivers, Trucks and Events, so the driver who delivered each address stays attached to the historical record.</div></div></div></div></div><div class="panel"><div class="panel-head"><div class="panel-title">Fleet</div><span class="chip">8 vehicles</span></div><div class="panel-body">${state.trucks.map(t=>`<div class="driver-line"><span class="truck-dot" style="background:${t.color}"></span><div style="flex:1"><b style="font-size:11px">${esc(t.id)}</b><span style="display:block;font-size:9px;color:var(--muted)">${esc(VEHICLES[t.type].label)} · ${t.capacity}T · ${esc(driverName(t))}</span></div></div>`).join('')}</div></div><div class="panel"><div class="panel-head"><div class="panel-title">Data tools</div></div><div class="panel-body"><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn" id="exportBtn">Export CSV</button><button class="btn" id="importBtn">Import CSV</button><button class="btn" id="clearTodayBtn">Clear today</button><input id="csvFile" type="file" accept=".csv,text/csv" class="hidden"></div></div></div></div></section></main></div>`}
function renderMiniJob(j){const t=jobTruck(j);return `<div class="job-mini" draggable="true" data-job="${j.id}"><div class="job-top"><b>${esc(j.customer||'No customer')}</b><span class="status ${statusClass(j.status)}">${esc(statusLabel(j.status))}</span></div><div class="addr">${esc(j.address)}</div><div class="chips"><span class="chip gold">${esc(VEHICLES[j.vehicleType]?.label||j.vehicleType)}</span><span class="chip">${Number(j.serviceMin||20)} min</span>${Number(j.weight||0)?`<span class="chip">${Number(j.weight).toFixed(1)}T</span>`:''}</div></div>`}
function renderRoute(t){const js=truckJobs(t),m=routeMetrics[t.id]||routeEstimate(t),pct=Math.min(100,assignedWeight(t)/Math.max(.1,t.capacity)*100);return `<article class="route" data-truck="${t.id}"><div class="route-head"><div class="route-main"><span class="truck-dot" style="background:${t.color}"></span><div class="route-name"><b>${esc(t.id)}</b><span>${esc(VEHICLES[t.type].label)} · ${assignedWeight(t).toFixed(1)} / ${t.capacity}T · ${m.distKm.toFixed(1)} km · ${Math.round(m.totalMin)} min total</span></div></div><div class="route-head-actions"><button class="mini-btn" data-route-share="${t.id}">Share</button><button class="mini-btn" data-drive="${t.id}">Drive</button></div></div><div class="route-body"><div class="driver-line"><label>Driver</label><select data-assign-driver="${t.id}"><option value="">Select driver</option>${state.drivers.map(d=>`<option value="${d.id}" ${t.driverId===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select></div><div class="route-metrics"><div class="metric"><span>Stops</span><b>${js.length}</b></div><div class="metric"><span>Road</span><b>${Math.round(m.driveMin)}m</b></div><div class="metric"><span>Service</span><b>${Math.round(m.service)}m</b></div><div class="metric"><span>Load</span><b>${pct.toFixed(0)}%</b></div></div><div class="loadbar"><i style="width:${pct}%"></i></div><div class="route-drop" data-drop-truck="${t.id}">${js.map((j,i)=>renderStop(j,t,i)).join('')||'<div class="empty">Drop a compatible delivery here.</div>'}</div></div></article>`}
function renderStop(j,t,i){return `<div class="stop" draggable="true" data-job="${j.id}" data-before="${j.id}"><div class="stop-num">${i+1}</div><div class="stop-copy"><b>${esc(j.customer||'No customer')}</b><span>${esc(j.address)}</span><span>${esc(driverName(t))} · ${esc(j.status)}</span></div><div class="stop-actions"><button class="mini-btn" data-edit-job="${j.id}">•••</button></div></div>`}
function renderTableJob(j){const t=jobTruck(j);return `<tr><td><b>${esc(j.customer)}</b><div style="color:var(--muted);font-size:9px">${esc(j.phone||'')}</div></td><td>${esc(j.address)}</td><td>${esc(VEHICLES[j.vehicleType]?.label||j.vehicleType)}</td><td>${esc(t?.id||'Unassigned')}</td><td>${esc(t?driverName(t):'—')}</td><td><span class="status ${statusClass(j.status)}">${esc(j.status)}</span></td><td>${Number(j.serviceMin||20)}m</td><td>${Number(j.weight||0).toFixed(1)}T</td><td style="white-space:nowrap"><button class="mini-btn" data-edit-job="${j.id}">Edit</button> <button class="mini-btn" data-driver-job="${j.id}">Drive</button></td></tr>`}
function renderHistory(e){const j=state.jobs.find(x=>x.id===e.jobId),t=j?jobTruck(j):null;return `<tr><td>${new Date(e.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</td><td>${esc(e.type)}</td><td>${esc(j?.customer||e.jobId||'—')}</td><td>${esc(j?.status||'—')}</td><td>${esc(t?.id||e.data?.truckId||'—')}</td><td>${esc(t?driverName(t):e.data?.driverId||'—')}</td><td>${esc(JSON.stringify(e.data||{}))}</td></tr>`}
function bindUI(){document.getElementById('addBtn').onclick=()=>openDeliveryModal();document.getElementById('optBtn').onclick=autoOptimize;document.getElementById('moreBtn').onclick=()=>openMoreModal();document.getElementById('dateInput').onchange=e=>{state.settings.selectedDate=e.target.value;saveSettingsOnly();render()};document.getElementById('globalSearch').oninput=()=>{document.querySelectorAll('.job-mini').forEach(el=>{const j=state.jobs.find(x=>x.id===el.dataset.job);const q=document.getElementById('globalSearch').value.toLowerCase();el.style.display=(!q||[j.customer,j.address,j.status,j.vehicleType].some(v=>String(v||'').toLowerCase().includes(q)))?'':'none'})};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchView(b.dataset.view));document.querySelectorAll('[data-assign-driver]').forEach(s=>s.onchange=e=>assignDriver(s.dataset.assignDriver,e.target.value));document.querySelectorAll('[data-route-share]').forEach(b=>b.onclick=()=>shareRoute(b.dataset.routeShare));document.querySelectorAll('[data-drive]').forEach(b=>b.onclick=()=>openDriverView(b.dataset.drive));document.querySelectorAll('[data-edit-job]').forEach(b=>b.onclick=()=>openDeliveryModal(b.dataset.editJob));document.querySelectorAll('[data-driver-job]').forEach(b=>{b.onclick=()=>{const j=state.jobs.find(x=>x.id===b.dataset.driverJob);if(j?.truckId)openDriverView(j.truckId)}});document.getElementById('queueDrop').ondragover=e=>{e.preventDefault();e.currentTarget.classList.add('over')};document.getElementById('queueDrop').ondragleave=e=>e.currentTarget.classList.remove('over');document.getElementById('queueDrop').ondrop=e=>{e.preventDefault();e.currentTarget.classList.remove('over');moveJob(e.dataTransfer.getData('job'), '')};document.querySelectorAll('.job-mini').forEach(el=>el.ondragstart=e=>e.dataTransfer.setData('job',el.dataset.job));document.querySelectorAll('.stop').forEach(bindStopDrag);document.querySelectorAll('[data-drop-truck]').forEach(el=>{el.ondragover=e=>{e.preventDefault();el.classList.add('over')};el.ondragleave=()=>el.classList.remove('over');el.ondrop=e=>{e.preventDefault();el.classList.remove('over');const id=e.dataTransfer.getData('job');moveJob(id,el.dataset.dropTruck)}});if(document.getElementById('fitBtn'))document.getElementById('fitBtn').onclick=fitAll;document.getElementById('centerBtn').onclick=centerWarehouse;if(document.getElementById('saveWhBtn'))document.getElementById('saveWhBtn').onclick=saveWarehouse;document.getElementById('saveDriversBtn')?.addEventListener('click',saveDrivers);document.getElementById('syncBtn')?.addEventListener('click',()=>{state.settings.excelWebhook=document.getElementById('excelWebhook').value.trim();state.settings.trackingWebhook=document.getElementById('trackingWebhook').value.trim();saveSettingsOnly().then(syncExcel)});document.getElementById('exportBtn')?.addEventListener('click',exportCsv);document.getElementById('importBtn')?.addEventListener('click',()=>document.getElementById('csvFile').click());document.getElementById('csvFile')?.addEventListener('change',importCsv);document.getElementById('clearTodayBtn')?.addEventListener('click',clearToday)}
function bindStopDrag(el){el.addEventListener('dragstart',e=>e.dataTransfer.setData('job',el.dataset.job));el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('over')});el.addEventListener('dragleave',()=>el.classList.remove('over'));el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('over');const id=e.dataTransfer.getData('job');const t=state.trucks.find(t=>t.id===el.closest('[data-truck]').dataset.truck);moveJob(id,t.id,el.dataset.before)})}
function switchView(view){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.view===view));document.getElementById('boardView').style.display=view==='board'?'block':'none';document.getElementById('jobsView').classList.toggle('show',view==='jobs');document.getElementById('historyView').classList.toggle('show',view==='history');document.getElementById('settingsView').classList.toggle('show',view==='settings')}
function renderMapShell(){setTimeout(()=>{if(map)drawMap()},0)}
function loadLeaflet(){if(window.L){startMap();return}const css=document.createElement('link');css.rel='stylesheet';css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(css);const s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.onload=startMap;s.onerror=()=>{const f=document.getElementById('map-fallback');if(f)f.innerHTML='<div class="box">The operations board is ready. Map tiles could not load.</div>'};document.head.appendChild(s)}
function startMap(){if(map||!window.L)return;try{map=L.map('map',{zoomControl:true}).setView([51.05,-114.07],10);L.tileLayer(CONFIG.tiles,{attribution:CONFIG.attribution,maxZoom:19}).addTo(map);document.getElementById('map-fallback')?.remove();drawMap()}catch(e){console.error(e)}}
async function drawMap(){if(!map)return;mapLayers.forEach(x=>{try{map.removeLayer(x)}catch(e){}});mapLayers=[];const bounds=[];const wh=state.settings.warehouse;if(Number.isFinite(wh.lat)&&Number.isFinite(wh.lng)){const m=L.marker([wh.lat,wh.lng],{icon:L.divIcon({className:'',html:'<div style="background:#202522;color:#fff;border:2px solid #fff;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:800">WH</div>',iconSize:[30,30],iconAnchor:[15,15]})}).bindTooltip('Warehouse').addTo(map);mapLayers.push(m);bounds.push([wh.lat,wh.lng])}for(const t of state.trucks){const js=truckJobs(t).filter(j=>Number.isFinite(j.lat)&&Number.isFinite(j.lng));const pts=js.map(j=>[j.lat,j.lng]);js.forEach((j,i)=>{const icon=L.divIcon({className:'',html:`<div style="background:${t.color};color:#fff;width:28px;height:28px;border-radius:9px;border:2px solid #fff;display:grid;place-items:center;font-size:10px;font-weight:800;box-shadow:0 3px 10px rgba(0,0,0,.18)">${i+1}</div>`,iconSize:[28,28],iconAnchor:[14,14]});const m=L.marker([j.lat,j.lng],{icon}).bindPopup(`<b>${esc(j.customer)}</b><br>${esc(j.address)}<br>${esc(t.id)} · ${esc(driverName(t))}<br>${esc(j.status)}`).addTo(map);mapLayers.push(m);bounds.push([j.lat,j.lng])});if(pts.length>=2){const line=L.polyline(pts,{color:t.color,weight:5,opacity:.82});line.on('mouseover',()=>line.setStyle({weight:10,opacity:1}));line.on('mouseout',()=>line.setStyle({weight:5,opacity:.82}));line.addTo(map);mapLayers.push(line);await updateRoadLine(t,line)}}for(const j of unassignedJobs().filter(j=>Number.isFinite(j.lat)&&Number.isFinite(j.lng))){const m=L.circleMarker([j.lat,j.lng],{radius:7,color:'#8a8479',fillColor:'#8a8479',fillOpacity:.9}).bindPopup(`<b>${esc(j.customer)}</b><br>${esc(j.address)}<br>Unassigned`).addTo(map);mapLayers.push(m);bounds.push([j.lat,j.lng])}if(bounds.length)map.fitBounds(bounds,{padding:[24,24],maxZoom:13})}
async function updateRoadLine(t,line){const js=truckJobs(t).filter(j=>Number.isFinite(j.lat)&&Number.isFinite(j.lng));if(!js.length)return;const w=state.settings.warehouse;const coords=[];if(Number.isFinite(w.lat)&&Number.isFinite(w.lng))coords.push(`${w.lng},${w.lat}`);js.forEach(j=>coords.push(`${j.lng},${j.lat}`));if(Number.isFinite(w.lat)&&Number.isFinite(w.lng))coords.push(`${w.lng},${w.lat}`);if(coords.length<2)return;try{const r=await fetch(CONFIG.osrm+coords.join(';')+'?overview=full&geometries=geojson&steps=false');if(!r.ok)throw new Error('routing '+r.status);const d=await r.json();const rr=d.routes?.[0];if(!rr)throw new Error('no route');routeMetrics[t.id]={distKm:rr.distance/1000,driveMin:rr.duration/60,totalMin:rr.duration/60+js.reduce((s,j)=>s+Number(j.serviceMin||20),0),service:js.reduce((s,j)=>s+Number(j.serviceMin||20),0),stops:js.length};line.setLatLngs(rr.geometry.coordinates.map(p=>[p[1],p[0]]));const rt=document.querySelector(`[data-truck="${t.id}"] .route-name span`);if(rt)rt.textContent=`${VEHICLES[t.type].label} · ${assignedWeight(t).toFixed(1)} / ${t.capacity}T · ${routeMetrics[t.id].distKm.toFixed(1)} km · ${Math.round(routeMetrics[t.id].totalMin)} min`;}catch(e){const m=routeEstimate(t);routeMetrics[t.id]=m;const rt=document.querySelector(`[data-truck="${t.id}"] .route-name span`);if(rt)rt.textContent=`${VEHICLES[t.type].label} · ${assignedWeight(t).toFixed(1)} / ${t.capacity}T · ${m.distKm.toFixed(1)} km · ${Math.round(m.totalMin)} min`;}}
async function refreshRouteMetrics(){if(!map)return;drawMap()}
function fitAll(){if(!map)return;drawMap()}
function centerWarehouse(){if(!map)return;const w=state.settings.warehouse;if(Number.isFinite(w.lat)&&Number.isFinite(w.lng))map.setView([w.lat,w.lng],13);else map.setView([51.05,-114.07],10)}
function openMoreModal(){openModal('<div class="modal-head"><b>Operations tools</b><button class="btn icon" data-close>×</button></div><div class="modal-body"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn" id="excelQuick">Sync to Excel</button><button class="btn" id="driversQuick">Manage drivers</button><button class="btn" id="importQuick">Import CSV</button><button class="btn" id="exportQuick">Export CSV</button></div></div>');document.getElementById('excelQuick').onclick=()=>{closeModal();switchView('settings')};document.getElementById('driversQuick').onclick=()=>{closeModal();switchView('settings');document.getElementById('saveDriversBtn')?.scrollIntoView({behavior:'smooth',block:'center'})};document.getElementById('importQuick').onclick=()=>{closeModal();document.getElementById('csvFile')?.click()};document.getElementById('exportQuick').onclick=exportCsv}
function openModal(html){const m=document.getElementById('modal');m.innerHTML=`<div class="modal-card">${html}</div>`;m.classList.add('show');m.querySelector('[data-close]')?.addEventListener('click',closeModal);return m}
function closeModal(){document.getElementById('modal').classList.remove('show');document.getElementById('modal').innerHTML=''}
async function openDeliveryModal(editId){const j=editId?state.jobs.find(x=>x.id===editId):null;const m=openModal(`<div class="modal-head"><b>${j?'Edit delivery':'New delivery'}</b><button class="btn icon" data-close>×</button></div><div class="modal-body"><div class="form-grid"><div class="field"><label>Customer</label><input id="fCustomer" value="${esc(j?.customer||'')}"></div><div class="field"><label>Phone</label><input id="fPhone" value="${esc(j?.phone||'')}"></div><div class="field full"><label>Delivery address</label><div class="address-wrap"><input id="fAddress" autocomplete="off" placeholder="Start typing a full Alberta address…" value="${esc(j?.address||'')}"><div id="suggestions" class="suggestions"></div></div></div><div class="field"><label>Vehicle</label><select id="fVehicle"><option value="5T" ${j?.vehicleType==='5T'?'selected':''}>5 Ton</option><option value="3T" ${j?.vehicleType==='3T'?'selected':''}>3 Ton</option><option value="SPRINTER" ${j?.vehicleType==='SPRINTER'?'selected':''}>Sprinter</option></select></div><div class="field"><label>Weight / load (T)</label><input id="fWeight" type="number" min="0" step="0.1" value="${esc(j?.weight??'')}"></div><div class="field"><label>Service time (min)</label><input id="fService" type="number" min="5" step="5" value="${esc(j?.serviceMin??20)}"></div><div class="field"><label>Priority</label><select id="fPriority"><option value="0" ${Number(j?.priority||0)===0?'selected':''}>Normal</option><option value="1" ${Number(j?.priority||0)===1?'selected':''}>High</option><option value="2" ${Number(j?.priority||0)===2?'selected':''}>Critical</option></select></div><div class="field"><label>Time window start</label><input id="fStart" type="time" value="${esc(j?.windowStart||'')}"></div><div class="field"><label>Time window end</label><input id="fEnd" type="time" value="${esc(j?.windowEnd||'')}"></div><div class="field full"><label>Notes</label><textarea id="fNotes" placeholder="Site obstacles, lock codes, unloading notes…">${esc(j?.notes||'')}</textarea></div></div></div><div class="modal-foot"><button class="btn" data-close>Cancel</button>${j?'<button class="btn danger" id="deleteDelivery">Delete</button>':''}<button class="btn gold" id="saveDelivery">${j?'Save changes':'Add to unassigned'}</button></div>`);let geo={lat:j?.lat??null,lng:j?.lng??null,postal:j?.postal||'',city:j?.city||'',province:'Alberta'};attachAutocomplete(m.querySelector('#fAddress'),m.querySelector('#suggestions'),v=>{geo=v});m.querySelector('#saveDelivery').onclick=async()=>{const job={id:j?.id||uid('job'),date:state.settings.selectedDate,customer:m.querySelector('#fCustomer').value.trim(),phone:m.querySelector('#fPhone').value.trim(),address:m.querySelector('#fAddress').value.trim(),vehicleType:m.querySelector('#fVehicle').value,weight:Number(m.querySelector('#fWeight').value||0),serviceMin:Number(m.querySelector('#fService').value||20),priority:Number(m.querySelector('#fPriority').value||0),windowStart:m.querySelector('#fStart').value,windowEnd:m.querySelector('#fEnd').value,notes:m.querySelector('#fNotes').value.trim(),lat:geo.lat,lng:geo.lng,postal:geo.postal,city:geo.city,province:'Alberta',truckId:j?.truckId||'',stopIndex:j?.stopIndex??null,status:j?.status||'Scheduled',createdAt:j?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};if(!job.address){toast('Add a delivery address.');return}if(!job.lat||!job.lng){toast('Select an address suggestion so routing coordinates are saved.');return}if(j){Object.assign(j,job);await put('jobs',j);await logEvent('edited',j.id,{})}else{state.jobs.push(job);await put('jobs',job);await logEvent('created',job.id,{})}closeModal();render();refreshRouteMetrics();syncExcelSilently();toast(j?'Delivery updated.':'Delivery added to unassigned queue.');};if(j)m.querySelector('#deleteDelivery').onclick=()=>{closeModal();removeJob(j.id)}}
let acTimer=null;function attachAutocomplete(input,list,onSelect){input.addEventListener('input',()=>{clearTimeout(acTimer);const q=input.value.trim();if(q.length<4){list.classList.remove('show');return}acTimer=setTimeout(async()=>{try{const u=new URL(CONFIG.photon);u.searchParams.set('q',q);u.searchParams.set('bbox',AB_BBOX.join(','));u.searchParams.set('limit','10');u.searchParams.set('lang','en');const r=await fetch(u);const d=await r.json();const features=(d.features||[]).filter(f=>isAlberta(f.properties)).slice(0,8);if(!features.length){list.innerHTML='<div class="suggestion"><b>No Alberta address found</b><span>Try including the city or postal code.</span></div>';list.classList.add('show');return}list.innerHTML=features.map((f,i)=>{const p=f.properties||{},coord=f.geometry?.coordinates||[];const main=[p.housenumber,p.street].filter(Boolean).join(' ')||p.name||p.street||'Address';const sub=[p.city||p.locality||p.town||p.county,p.state||'Alberta',p.postcode||''].filter(Boolean).join(' · ');return `<div class="suggestion" data-i="${i}"><b>${esc(main)}</b><span>${esc(sub)}</span></div>`}).join('');list.classList.add('show');list.querySelectorAll('.suggestion[data-i]').forEach(el=>el.onclick=()=>{const f=features[Number(el.dataset.i)];const p=f.properties||{},c=f.geometry?.coordinates||[];const main=[p.housenumber,p.street].filter(Boolean).join(' ')||p.name||p.street||'';const city=p.city||p.locality||p.town||'';const postal=p.postcode||'';const full=[main,city,'AB',postal].filter(Boolean).join(', ');input.value=full;list.classList.remove('show');onSelect({lat:Number(c[1]),lng:Number(c[0]),postal,city,province:'Alberta',address:full})})}catch(e){list.innerHTML='<div class="suggestion"><b>Address search unavailable</b><span>You can type the full Alberta address manually.</span></div>';list.classList.add('show')}},320)});document.addEventListener('click',e=>{if(!list.contains(e.target)&&e.target!==input)list.classList.remove('show')},{once:false})}
function isAlberta(p){const st=String(p.state||'').toLowerCase(),sc=String(p.statecode||'').toLowerCase(),cc=String(p.countrycode||p.country_code||'').toLowerCase();return (st==='alberta'||sc==='ab'||sc.endsWith('-ab'))&&(cc===''||cc==='ca'||cc==='can')}
function saveSettingsOnly(){return put('settings',{id:'settings',...state.settings})}
async function saveWarehouse(){state.settings.warehouse.name=document.getElementById('whName').value.trim();state.settings.warehouse.address=document.getElementById('whAddress').value.trim();const la=document.getElementById('whLat').value.trim(),lo=document.getElementById('whLng').value.trim();state.settings.warehouse.lat=la===''?null:Number(la);state.settings.warehouse.lng=lo===''?null:Number(lo);await saveSettingsOnly();render();toast('Warehouse saved.')}
async function saveDrivers(){document.querySelectorAll('[data-driver]').forEach(i=>{const d=state.drivers.find(x=>x.id===i.dataset.driver);if(d)d.name=i.value.trim()||d.name});document.querySelectorAll('[data-driver-truck]').forEach(i=>{const d=state.drivers.find(x=>x.id===i.dataset.driverTruck);if(d)d.defaultTruckId=i.value});for(const d of state.drivers)await put('drivers',d);render();syncExcelSilently();toast('Driver roster saved.')}
function buildSnapshot(){return {version:VERSION,syncId:uid('sync'),syncedAt:new Date().toISOString(),date:state.settings.selectedDate,warehouse:state.settings.warehouse,trucks:state.trucks.map(t=>({id:t.id,type:t.type,capacity:t.capacity,driverId:t.driverId,driver:driverName(t),active:t.active})),drivers:state.drivers.map(d=>({...d})),deliveries:jobsToday().map(j=>{const t=jobTruck(j),r=t?truckJobs(t):[];return {...j,truck:t?.id||'',driver:t?driverName(t):'',stop:j.truckId?(r.findIndex(x=>x.id===j.id)+1):'',status:j.status||'Scheduled'}}),events:state.events.filter(e=>e.time.startsWith(state.settings.selectedDate))}}
async function syncExcel(){state.settings.excelWebhook=document.getElementById('excelWebhook').value.trim();state.settings.trackingWebhook=document.getElementById('trackingWebhook').value.trim();await saveSettingsOnly();await syncExcelSilently(true)}
async function syncExcelSilently(manual=false){const url=state.settings.excelWebhook;if(!url)return;try{await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({payloadJson:JSON.stringify(buildSnapshot())})});if(manual)toast('Excel sync sent.')}catch(e){if(manual)toast('Excel sync failed. Check webhook URL.')}}
function exportCsv(){const rows=[['DeliveryID','Date','Customer','Phone','Address','City','Province','PostalCode','VehicleType','WeightTons','ServiceMinutes','TimeWindowStart','TimeWindowEnd','Priority','Truck','Driver','Stop','Status','Latitude','Longitude','Notes','CreatedAt','UpdatedAt']];jobsToday().forEach(j=>{const t=jobTruck(j),r=t?truckJobs(t):[];rows.push([j.id,j.date,j.customer,j.phone,j.address,j.city,'Alberta',j.postal,j.vehicleType,j.weight,j.serviceMin,j.windowStart,j.windowEnd,j.priority,t?.id||'',t?driverName(t):'',j.truckId?r.findIndex(x=>x.id===j.id)+1:'',j.status,j.lat,j.lng,j.notes,j.createdAt,j.updatedAt])});const csv=rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`moulding-deliveries-${state.settings.selectedDate}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function parseCsv(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q&&c==='"'&&text[i+1]==='"'){cell+='"';i++;continue}if(c==='"'){q=!q;continue}if(c===','&&!q){row.push(cell);cell='';continue}if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell='';continue}cell+=c}if(cell.length||row.length){row.push(cell);rows.push(row)}return rows}
async function importCsv(ev){const file=ev.target.files[0];if(!file)return;const text=await file.text();const rows=parseCsv(text);const headers=rows.shift().map(x=>x.trim());const idx=n=>headers.findIndex(h=>h.toLowerCase()===n.toLowerCase());let count=0;for(const r of rows){if(!r.length)continue;const job={id:r[idx('DeliveryID')]||uid('job'),date:r[idx('Date')]||state.settings.selectedDate,customer:r[idx('Customer')]||'',phone:r[idx('Phone')]||'',address:r[idx('Address')]||'',city:r[idx('City')]||'',province:'Alberta',postal:r[idx('PostalCode')]||'',vehicleType:r[idx('VehicleType')]||'5T',weight:Number(r[idx('WeightTons')]||0),serviceMin:Number(r[idx('ServiceMinutes')]||20),windowStart:r[idx('TimeWindowStart')]||'',windowEnd:r[idx('TimeWindowEnd')]||'',priority:Number(r[idx('Priority')]||0),truckId:'',stopIndex:null,status:'Scheduled',lat:Number(r[idx('Latitude')]||NaN),lng:Number(r[idx('Longitude')]||NaN),notes:r[idx('Notes')]||'',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};state.jobs=state.jobs.filter(x=>x.id!==job.id);state.jobs.push(job);await put('jobs',job);count++}render();toast(`Imported ${count} deliveries.`);ev.target.value=''}
async function clearToday(){if(!confirm('Remove all deliveries for the selected date? This cannot be undone.'))return;const js=jobsToday();for(const j of js)await del('jobs',j.id);state.jobs=state.jobs.filter(j=>j.date!==state.settings.selectedDate);render();toast('Today cleared.')}
function shareRoute(id){const t=state.trucks.find(x=>x.id===id);const js=truckJobs(t).filter(j=>Number.isFinite(j.lat)&&Number.isFinite(j.lng));if(!js.length){toast('No mapped stops on this route.');return}const origin=Number.isFinite(state.settings.warehouse.lat)&&Number.isFinite(state.settings.warehouse.lng)?`${state.settings.warehouse.lat},${state.settings.warehouse.lng}`:`${js[0].lat},${js[0].lng}`;const dest=`${js.at(-1).lat},${js.at(-1).lng}`;const way=js.slice(0,-1).map(j=>`${j.lat},${j.lng}`).join('|');let url=`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(dest)}&travelmode=driving`;if(way)url+=`&waypoints=${encodeURIComponent(way.slice(0,1600))}`;if(navigator.share){navigator.share({title:`${t.id} · ${driverName(t)}`,url}).catch(()=>{})}else{navigator.clipboard.writeText(url);toast('Google Maps route copied.')}}
function openDriverView(truckId){const t=state.trucks.find(x=>x.id===truckId);if(!t)return;currentDriverTruck=t.id;renderDriverScreen();document.getElementById('driverScreen').classList.add('show');startGPS(t.id)}
function renderDriverScreen(){const t=state.trucks.find(x=>x.id===currentDriverTruck);if(!t)return;const js=truckJobs(t);const next=js.find(j=>!['Delivered','Canceled'].includes(j.status));document.getElementById('driverScreen').innerHTML=`<div class="driver-top"><div><b>${esc(t.id)} · ${esc(driverName(t))}</b><div style="font-size:9px;color:var(--muted);margin-top:3px">${js.length} stops · ${VEHICLES[t.type].label}</div></div><button class="btn icon" id="closeDriver">×</button></div><div class="driver-main">${next?`<div class="next-card"><div class="label">Next stop · ${js.findIndex(j=>j.id===next.id)+1} of ${js.length}</div><h2>${esc(next.customer)}</h2><p>${esc(next.address)}</p><p style="margin-top:7px">${Number(next.serviceMin||20)} min unload · ${Number(next.weight||0).toFixed(1)}T · ${esc(next.status)}</p><div class="driver-actions"><button class="btn" id="navNext">Navigate</button><button class="btn" id="callNext">Call</button><button class="btn" id="arrivedNext">Arrived</button><button class="btn gold" id="podNext">Complete + POD</button></div></div><div style="margin-top:12px">${js.map((j,i)=>`<div class="stop" style="margin-bottom:8px"><div class="stop-num">${i+1}</div><div class="stop-copy"><b>${esc(j.customer)}</b><span>${esc(j.address)}</span></div><span class="status ${statusClass(j.status)}">${esc(j.status)}</span></div>`).join('')}</div>`:'<div class="next-card"><div class="label">Route complete</div><h2>All stops delivered</h2><p>Nothing else is assigned to this vehicle.</p></div>'}</div>`;document.getElementById('closeDriver').onclick=()=>{document.getElementById('driverScreen').classList.remove('show');stopGPS()};if(next){document.getElementById('navNext').onclick=()=>{const url=`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(next.lat+','+next.lng)}&travelmode=driving`;location.href=url};document.getElementById('callNext').onclick=()=>{if(next.phone)location.href=`tel:${next.phone}`;else toast('No customer phone saved.')};document.getElementById('arrivedNext').onclick=()=>setJobStatus(next.id,'Arrived');document.getElementById('podNext').onclick=()=>openPodModal(next.id)}}
async function startGPS(truckId){if(!navigator.geolocation)return;stopGPS();gpsWatch=navigator.geolocation.watchPosition(async pos=>{const item={id:uid('gps'),truckId,lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy,at:new Date().toISOString()};await put('telemetry',item);if(state.settings.trackingWebhook){try{await fetch(state.settings.trackingWebhook,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(item)})}catch(e){}}},{enableHighAccuracy:true,maximumAge:15000,timeout:20000})}
function stopGPS(){if(gpsWatch!==null){navigator.geolocation.clearWatch(gpsWatch);gpsWatch=null}}
async function openPodModal(jobId){const m=openModal(`<div class="modal-head"><b>Proof of delivery</b><button class="btn icon" data-close>×</button></div><div class="modal-body"><div class="form-grid"><div class="field full"><label>Driver notes</label><textarea id="podNotes" placeholder="Delivered to site, left at garage, damaged item, customer unavailable…"></textarea></div><div class="field full"><label>Photos</label><input id="podFiles" type="file" accept="image/*" multiple capture="environment"><div id="podPreview" class="pod-preview"></div></div><div class="field full"><label>Customer signature</label><canvas id="sig" class="signature"></canvas><button class="btn" id="clearSig" style="margin-top:7px">Clear signature</button></div></div></div><div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn gold" id="completePod">Complete delivery</button></div>`);const sig=m.querySelector('#sig'),ctx=sig.getContext('2d');sig.width=sig.clientWidth*2;sig.height=360;ctx.scale(2,2);ctx.lineWidth=2;ctx.lineCap='round';let drawing=false;const point=e=>{const r=sig.getBoundingClientRect();return{x:(e.touches?e.touches[0].clientX:e.clientX)-r.left,y:(e.touches?e.touches[0].clientY:e.clientY)-r.top}};const down=e=>{drawing=true;const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault()};const move=e=>{if(!drawing)return;const p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault()};const up=()=>drawing=false;['mousedown','touchstart'].forEach(x=>sig.addEventListener(x,down,{passive:false}));['mousemove','touchmove'].forEach(x=>sig.addEventListener(x,move,{passive:false}));['mouseup','mouseleave','touchend'].forEach(x=>sig.addEventListener(x,up));m.querySelector('#clearSig').onclick=()=>ctx.clearRect(0,0,sig.width,sig.height);m.querySelector('#completePod').onclick=async()=>{const j=state.jobs.find(x=>x.id===jobId);const files=[...(m.querySelector('#podFiles').files||[])];for(const f of files){const id=uid('media');await put('media',{id,jobId,type:'photo',name:f.name,blob:f,size:f.size,createdAt:new Date().toISOString()})}j.pod={notes:m.querySelector('#podNotes').value,signature:sig.toDataURL('image/png'),completedAt:new Date().toISOString()};j.status='Delivered';j.updatedAt=new Date().toISOString();await put('jobs',j);await logEvent('delivered',jobId,{pod:true,photos:files.length});closeModal();renderDriverScreen();render();syncExcelSilently();toast('Delivery completed with POD.')}}
async function migrateLegacy(){try{const legacyJobs=JSON.parse(localStorage.getItem('ms_jobs')||'[]');if(Array.isArray(legacyJobs)&&legacyJobs.length&&!state.jobs.length){for(const old of legacyJobs){const type=old.vehicle==='5 Ton'?'5T':old.vehicle==='3 Ton'?'3T':'SPRINTER';const status=old.status==='Unassigned'?'Scheduled':(old.status||'Scheduled');const j={id:old.id||uid('job'),date:old.date||state.settings.selectedDate,customer:old.customer||'',phone:old.phone||'',address:old.address||'',city:old.city||'',province:'Alberta',postal:old.postal||'',vehicleType:type,weight:Number(old.weight||0),serviceMin:Number(old.service||20),priority:Number(old.priority||0),windowStart:old.windowStart||'',windowEnd:old.windowEnd||'',notes:old.notes||'',lat:Number.isFinite(Number(old.lat))?Number(old.lat):null,lng:Number.isFinite(Number(old.lng))?Number(old.lng):null,truckId:old.truckId||'',stopIndex:old.stopIndex??null,status,createdAt:old.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};state.jobs.push(j);await put('jobs',j)}}}catch(e){} try{const legacyDrivers=JSON.parse(localStorage.getItem('ms_drivers')||'[]');if(Array.isArray(legacyDrivers)&&legacyDrivers.length){legacyDrivers.forEach((name,i)=>{if(state.drivers[i])state.drivers[i].name=typeof name==='string'?name:state.drivers[i].name});for(const d of state.drivers)await put('drivers',d)}}catch(e){} try{for(const t of state.trucks){const n=localStorage.getItem('ms_truck_driver_'+t.id);if(n&&!t.driverId){const d=state.drivers.find(x=>x.name===n);if(d){t.driverId=d.id;await put('trucks',t)}}}}catch(e){} try{const oldWebhook=localStorage.getItem('ms_excel_webhook');if(oldWebhook&&!state.settings.excelWebhook){state.settings.excelWebhook=oldWebhook;await saveSettingsOnly()}}catch(e){}}
async function startup(){db=await openDB();await loadState();await migrateLegacy();render();}
window.addEventListener('error',e=>{console.error(e);if(!document.querySelector('.app-shell'))document.getElementById('root').innerHTML=`<div class="fatal"><div class="fatal-box"><h1>Moulding Store</h1><p>The application encountered an error.</p><pre>${esc(e.error?.stack||e.message||'Unknown error')}</pre></div></div>`});
startup().catch(e=>{document.getElementById('root').innerHTML=`<div class="fatal"><div class="fatal-box"><h1>Moulding Store</h1><p>Storage could not be initialized.</p><pre>${esc(e.stack||e.message||e)}</pre><button class="btn primary" onclick="indexedDB.deleteDatabase('moulding_store_worldclass');location.reload()">Reset local app data</button></div></div>`});
})();
</script>
