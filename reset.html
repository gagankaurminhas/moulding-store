<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moulding Store Reset</title><style>body{font-family:system-ui;background:#f6f3ed;color:#201e1a;display:grid;place-items:center;min-height:100vh;margin:0}.box{background:#fffdf9;border:1px solid #e4ddd1;border-radius:18px;padding:28px;max-width:520px;box-shadow:0 20px 60px #0001}button{background:#b68b42;color:#fff;border:0;border-radius:10px;padding:11px 15px;font-weight:800}</style><div class="box"><h2>Resetting old app cache…</h2><p id="s">Please wait.</p><button id="go" hidden>Open App</button></div><script>(async()=>{try{for(const r of (await navigator.serviceWorker.getRegistrations())) await r.unregister();for(const k of await caches.keys()) await caches.delete(k);document.getElementById('s').textContent='Old service workers and caches cleared. Open the app.';const b=document.getElementById('go');b.hidden=false;b.onclick=()=>location.href='./index.html?v=v11';}catch(e){document.getElementById('s').textContent='Reset completed with limited cache access. You can still open the app.';const b=document.getElementById('go');b.hidden=false;b.onclick=()=>location.href='./index.html?v=v11'}})()</script>
