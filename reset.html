<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moulding Store Refresh</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f1ea;font-family:system-ui;color:#24221e}.box{width:min(430px,calc(100% - 40px));background:#fffdf9;border:1px solid #e2dbcf;border-radius:18px;box-shadow:0 18px 50px rgba(42,35,24,.12);padding:28px;text-align:center}.mark{width:44px;height:44px;border-radius:12px;background:#fbf3df;border:1px solid #ead9b5;margin:0 auto 14px;display:grid;place-items:center;color:#9a702b;font-weight:800}</style></head><body><div class="box"><div class="mark">MS</div><h2>Refreshing Moulding Store</h2><p>Clearing old app cache. Saved deliveries are kept.</p></div><script>(async()=>{try{const r=await navigator.serviceWorker?.getRegistrations?.()||[];await Promise.all(r.map(x=>x.unregister().catch(()=>false)));await Promise.all((await caches.keys()).map(k=>caches.delete(k)))}catch(e){}setTimeout(()=>location.replace('./?v='+Date.now()),700)})();</script></body></html>
