<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moulding Store Reset</title><style>body{font-family:system-ui;background:#f4f0e8;color:#202522;display:grid;place-items:center;min-height:100vh;margin:0}.box{background:#fffdfa;border:1px solid #e6dfd3;border-radius:18px;padding:26px;max-width:460px;box-shadow:0 20px 60px rgba(30,25,18,.1)}button{background:#202522;color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:700}</style></head><body><div class="box"><h2>Moulding Store</h2><p>This clears old service workers/caches from previous prototypes. It does not delete the new app's IndexedDB data.</p><button id="go">Clean old cache & open app</button></div><script>document.getElementById('go').onclick=async()=>{try{if(navigator.serviceWorker){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){} location.href='./index.html?clean='+Date.now()}</script></body></html>
